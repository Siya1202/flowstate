services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: flowstate
      POSTGRES_USER: flowstate_user
      POSTGRES_PASSWORD: flowstate123
    ports:
      - "5434:5432"   # 5432 and 5433 are taken by other containers
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # Redis is NOT started here — froncort-workspace-redis-1 is already
  # running on 0.0.0.0:6379 and Flowstate reuses it via REDIS_URL.

volumes:
  postgres_data:
  chroma_data:
